name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/mo-personalwebsite
        tags: |
          type=raw,value=latest
          type=sha,prefix={{branch}}-
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./src/Mo.PersonalWebsite
        file: ./src/Mo.PersonalWebsite/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BUILD_NUMBER=${{ github.run_number }}
          BUILD_SHA=${{ github.sha }}

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: deploy-production

    steps:
    - uses: actions/checkout@v4

    # Everything the deploy does lives in deployment/deploy.sh, so running it by
    # hand on the server does exactly what this job does
    - name: Run deploy.sh on the server
      env:
        DEPLOY_USER: ${{ secrets.SSH_USER }}
        DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
      run: |
        # Secrets set through the UI or with `echo` often carry a trailing
        # newline, which turns into an unresolvable host or user name
        user=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
        host=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')

        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/key && chmod 600 ~/.ssh/key

        # Fingerprints are not secret. The first says which key we are offering,
        # the second which machine answered - together they explain any
        # "Permission denied" without printing a single secret value
        ssh-keygen -lf ~/.ssh/key || echo "SSH_PRIVATE_KEY is malformed"
        ssh-keyscan -t ed25519 "$host" 2>/dev/null | ssh-keygen -lf - || echo "no host key from SERVER_HOST - check the value"

        # Compare a port the site serves with the SSH port from this same runner:
        # if 80 answers and 22 times out, SSH is filtered by source address
        echo "--- connectivity from this runner ---"
        timeout 10 bash -c "</dev/tcp/$host/80" && echo "port 80: reachable" || echo "port 80: unreachable"
        timeout 10 bash -c "</dev/tcp/$host/22" && echo "port 22: reachable" || echo "port 22: unreachable"
        echo "-------------------------------------"

        scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/key \
          deployment/docker-compose.yml deployment/deploy.sh "$user@$host:/root/mowebsite/"
        ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/key "$user@$host" \
          'chmod +x /root/mowebsite/deploy.sh && /root/mowebsite/deploy.sh'
