name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/mo-personalwebsite
        tags: |
          type=raw,value=latest
          type=sha,prefix={{branch}}-
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./src/Mo.PersonalWebsite
        file: ./src/Mo.PersonalWebsite/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BUILD_NUMBER=${{ github.run_number }}
          BUILD_SHA=${{ github.sha }}

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: deploy-production

    steps:
    - uses: actions/checkout@v4

    # Everything the deploy does lives in deployment/deploy.sh, so running it by
    # hand on the server does exactly what this job does
    - name: Run deploy.sh on the server
      env:
        HOST: ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}
        DEPLOY_USER: ${{ secrets.SSH_USER }}
        DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/key && chmod 600 ~/.ssh/key
        # Fingerprints are not secret, and this is the fastest way to tell a wrong
        # or mangled SSH_PRIVATE_KEY apart from a server that rejected a valid one
        ssh-keygen -lf ~/.ssh/key || echo "could not read the key - SSH_PRIVATE_KEY is malformed"
        ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
        # Neither of these prints a secret: lengths catch stray whitespace in the
        # values, and the host key fingerprint says which machine we reached
        echo "SSH_USER length: ${#DEPLOY_USER} (expected 4)  SERVER_HOST length: ${#DEPLOY_HOST} (expected 15)"
        ssh-keyscan -t ed25519 "$DEPLOY_HOST" 2>/dev/null | ssh-keygen -lf - || true
        scp -i ~/.ssh/key deployment/docker-compose.yml deployment/deploy.sh "$HOST:/root/mowebsite/"
        ssh -i ~/.ssh/key "$HOST" 'chmod +x /root/mowebsite/deploy.sh && /root/mowebsite/deploy.sh'
